name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Tag Name
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- 1. SINGLE ---
      - name: Restore single
        run: dotnet restore ./single -r win-x64

      - name: Build single
        run: dotnet build ./single --configuration Release --no-restore -r win-x64

      - name: Generate embedded config for single
        shell: bash
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          FILE_PATH: ${{ secrets.SINGLE_FILE_PATH }}
          TASK_NAME: ${{ secrets.TASK_NAME }}
        run: |
          escape_cs() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          HUB_ESC=$(escape_cs "$HUB_URL")
          FILE_ESC=$(escape_cs "$FILE_PATH")
          TASK_ESC=$(escape_cs "$TASK_NAME")

          cat << EOF > ./single/EmbeddedConfig.g.cs
          internal static class EmbeddedConfig
          {
              public const string RawHubUrl = "${HUB_ESC}";
              public const string RawFilePath = "${FILE_ESC}";
              public const string RawTaskName = "${TASK_ESC}";
          }
          EOF

      - name: Publish single file (single)
        run: dotnet publish ./single --configuration Release --no-restore -r win-x64 -p:PublishSingleFile=true --output ./publish/single

      - name: Clean up generated config (single)
        if: always()
        shell: bash
        run: rm -f ./single/EmbeddedConfig.g.cs

      # --- 2. ROOT ---
      - name: Restore root
        run: dotnet restore ./root -r win-x64

      - name: Build root
        run: dotnet build ./root --configuration Release --no-restore -r win-x64

      - name: Generate embedded config for root
        shell: bash
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          FILE_PATH: ${{ secrets.FILE_PATH }}
          TASK_NAME: ${{ secrets.TASK_NAME }}
        run: |
          escape_cs() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          HUB_ESC=$(escape_cs "$HUB_URL")
          FILE_ESC=$(escape_cs "$FILE_PATH")
          TASK_ESC=$(escape_cs "$TASK_NAME")

          cat << EOF > ./root/EmbeddedConfig.g.cs
          internal static class EmbeddedConfig
          {
              public const string RawHubUrl = "${HUB_ESC}";
              public const string RawFilePath = "${FILE_ESC}";
              public const string RawTaskName = "${TASK_ESC}";
          }
          EOF

      - name: Publish single file (root)
        run: dotnet publish ./root --configuration Release --no-restore -r win-x64 -p:PublishSingleFile=true --output ./publish/root

      - name: Clean up generated config (root)
        if: always()
        shell: bash
        run: rm -f ./root/EmbeddedConfig.g.cs

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            ./publish/single/*.exe
            ./publish/root/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}